[package]
name = "terra-companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Built separately from the companion workspace: tauri::generate_context!
# embeds the frontend, so `npm run build` must run first (see app/README.md).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
companion-core = { path = "../../crates/companion-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[lints.rust]
unsafe_code = "forbid"
