name: Build firmware and companion

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    strategy:
      matrix:
        profile: [normal, usb-probe]
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v5
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          if [ '${{ matrix.profile }}' = 'usb-probe' ]; then
            idf.py -D SDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.usb-probe.defaults' build
          else
            idf.py build
          fi
          # The container user differs from the checkout owner; allow git to read it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- dependencies.lock
      - name: Host unit tests and shared protocol vectors
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I firmware/main firmware/tests/test_time_utils.c firmware/main/util/time_utils.c -o /tmp/test-time
          /tmp/test-time
          cc -std=c11 -Wall -Wextra -Werror -I firmware/main firmware/tests/test_input_logic.c firmware/main/input/input_logic.c -o /tmp/test-input
          /tmp/test-input
          cc -std=c11 -Wall -Wextra -Werror -I firmware/main firmware/tests/test_disk_inspect.c firmware/main/storage/disk_inspect.c -o /tmp/test-disk
          /tmp/test-disk
          cc -std=c11 -Wall -Wextra -Werror -I firmware/main firmware/tests/test_protocol.c firmware/main/protocol/protocol.c -o /tmp/test-protocol
          /tmp/test-protocol docs/protocol-test-vectors
      - name: Protocol vectors match the Python reference
        run: |
          python3 scripts/gen-protocol-vectors.py /tmp/vectors
          diff -r -x README.md /tmp/vectors docs/protocol-test-vectors
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-${{ matrix.profile }}
          path: |
            firmware/build/terra.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
  companion:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v5
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace (shared protocol vectors)
        run: cargo test --workspace --locked
      - name: Smoke test CLI
        shell: pwsh
        run: |
          & ./target/debug/terra-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version command failed' }
          & ./target/debug/terra-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help command failed' }
          # The runner has no media session; 0 = none/session found, 1 = GSMTC unavailable.
          & ./target/debug/terra-cli.exe media
          if ($LASTEXITCODE -gt 1) { throw "media exited $LASTEXITCODE" }
          # No Bluetooth radio on the runner: 1 = no device / adapter unavailable.
          & ./target/debug/terra-cli.exe devices
          if ($LASTEXITCODE -gt 1) { throw "devices exited $LASTEXITCODE" }
          & ./target/debug/terra-cli.exe monitor
          if ($LASTEXITCODE -ne 2) { throw 'Unimplemented command must exit 2' }
          exit 0
